<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#042f2e"/>
      <stop offset="0.55" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <!-- Block-print style tile: a star of two squares, petals and dots -->
    <pattern id="tile" width="120" height="120" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#99f6e4" stroke-opacity="0.16" stroke-width="2">
        <rect x="35" y="35" width="50" height="50"/>
        <rect x="35" y="35" width="50" height="50" transform="rotate(45 60 60)"/>
        <circle cx="60" cy="60" r="14"/>
        <path d="M0 0 L20 20 M120 0 L100 20 M0 120 L20 100 M120 120 L100 100"/>
      </g>
      <g fill="#fde68a" fill-opacity="0.18">
        <circle cx="60" cy="60" r="4"/>
        <circle cx="0" cy="0" r="6"/><circle cx="120" cy="0" r="6"/>
        <circle cx="0" cy="120" r="6"/><circle cx="120" cy="120" r="6"/>
        <circle cx="60" cy="6" r="2.5"/><circle cx="60" cy="114" r="2.5"/>
        <circle cx="6" cy="60" r="2.5"/><circle cx="114" cy="60" r="2.5"/>
      </g>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <rect width="1200" height="1600" fill="url(#tile)"/>
  <rect width="1200" height="1600" fill="url(#glow)"/>
  <!-- Soft fabric waves -->
  <path d="M0 1250 C 250 1180, 450 1330, 700 1260 S 1050 1170, 1200 1230 L1200 1600 L0 1600 Z" fill="#f59e0b" fill-opacity="0.10"/>
  <path d="M0 1340 C 300 1270, 500 1420, 800 1350 S 1100 1290, 1200 1330 L1200 1600 L0 1600 Z" fill="#ffffff" fill-opacity="0.06"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
